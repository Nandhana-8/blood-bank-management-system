<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Blood Bank Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon">🩸</div>
      <h2>LifeStream BBMS</h2>
      <p>Secure Medical Staff & Admin Authentication</p>
    </div>

    {% if error %}
    <div style="background-color: #fee2e2; border-left: 4px solid #dc2626; color: #991b1b; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Staff Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (e.g. admin)" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px; margin-top: 10px;">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        Sign In to Blood Bank System
      </button>
    </form>

    <div class="login-helper">
      <strong>Demo Credentials for Testing:</strong><br>
      Username: <code style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-weight:700;">admin</code><br>
      Password: <code style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-weight:700;">admin123</code>
    </div>
  </div>
</body>
</html>
